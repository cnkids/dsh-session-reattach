# SonarQube 分析配置。
# 注意：令牌绝不能写入本文件（会被提交），通过环境变量传入。
# 分支 / 版本 / token 由 scripts/sonar-check.sh 统一处理，请用它触发扫描：
#   ./scripts/sonar-check.sh          # 自动取当前 git 分支
#   ./scripts/sonar-check.sh main     # 显式指定分支
# 直接裸跑 sonar-scanner 且不带 sonar.branch.name 时，结果会写进项目主分支。

sonar.projectKey=dsh-session-reattach
sonar.projectName=dsh-session-reattach
sonar.host.url=https://so.rclandy.com
sonar.sourceEncoding=UTF-8

# 插件本体是 sources，用例单独归类，便于计算「新代码覆盖率」
# scripts/ 里的构建与扫描脚本同样纳入分析（它们也是要维护的代码）
sonar.sources=lib,scripts
sonar.tests=test
sonar.test.inclusions=test/**/*.test.mjs

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# lib/client.js 由 scripts/build-client.mjs 生成（见其头部注释），
# 内容改由 lib/client-core.js 与 scripts/client-dom.js 分析，避免同一份逻辑被重复统计。
sonar.exclusions=node_modules/**,coverage/**,.scannerwork/**,lib/client.js

# scripts/client-dom.js 是被「内联进 bundle」的片段：单测通过 vm 装载生成的 bundle 来驱动它，
# 它自身文件不会被插桩，因此从覆盖率统计里排除（静态分析仍然覆盖它）。
sonar.coverage.exclusions=scripts/client-dom.js

# 分析后等待服务端算完门禁，让「门禁失败」直接体现为退出码
sonar.qualitygate.wait=true
